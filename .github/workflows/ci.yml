name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, Debug + ASan/UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev libdecor-0-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DPR_SANITIZE=ON -DPR_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke run
        run: ./build/pr-bench --width 256 --height 256 --ticks 30 --warmup 5

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings are not fatal on MSVC yet: the code has only been built with GCC and Clang so far.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
